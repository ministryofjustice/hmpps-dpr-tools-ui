name: Scheduled security scans

# Node stack: CodeQL, npm, and Veracode, all through hmpps-reporting-workflows.
# Veracode passes stack: node so the proxy builds with hmpps-reporting-actions.
# Pinned to test/tag-based-releases until that Node path is on @v1. Gradle
# callers stay on the default stack and are unchanged.

on:
  workflow_dispatch:
    inputs:
      scan:
        description: Which scan to run
        type: choice
        default: all
        options:
          - all
          - codeql
          - npm
          - veracode-pipeline
          - veracode-policy
  schedule:
    - cron: "19 6 * * MON-FRI" # codeql + npm + veracode-pipeline, every weekday
    - cron: "34 6 * * 1"       # veracode-policy, every Monday

jobs:
  codeql:
    name: Project security CodeQL actions scan
    if: |
      github.event.schedule == '19 6 * * MON-FRI' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","codeql"]'), inputs.scan))
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/security_codeql_actions.yml@v1
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit

  npm:
    name: Project security npm dependency check
    if: |
      github.event.schedule == '19 6 * * MON-FRI' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","npm"]'), inputs.scan))
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/security_npm_dependency.yml@v1
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit

  veracode-pipeline:
    name: Project security veracode pipeline scan
    if: |
      github.event.schedule == '19 6 * * MON-FRI' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","veracode-pipeline"]'), inputs.scan))
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/security_veracode_pipeline_scan.yml@test/tag-based-releases
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
      stack: node
      node-version: '24'
    secrets: inherit

  veracode-policy:
    name: Project security veracode policy scan
    if: |
      github.event.schedule == '34 6 * * 1' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","veracode-policy"]'), inputs.scan))
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/security_veracode_policy_scan.yml@test/tag-based-releases
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
      stack: node
      node-version: '24'
    secrets: inherit
