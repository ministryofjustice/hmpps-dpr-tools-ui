version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: 'production' # separate groups for production and development dependencies
        update-types: # only group minor and patch updates together
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'redis'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/' # Location of workflow files
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 3
  - package-ecosystem: 'helm'
    directory: '/helm_deploy/hmpps-dpr-tools-ui'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-patch'
